[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "python_magnetdb"
version = "0.1.0"
description = "MagnetDB platform"
authors = [
    {name = "Christophe Trophime", email = "christophe.trophime@lncmi.cnrs.fr"},
    {name = "Remi Caumette", email = "remicaumette@icloud.com"}
]
readme = "README.md"
license = "MIT"
keywords = ["magnetdb", "magnets", "database"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django :: 5.0",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

[project.urls]
homepage = "https://github.com/MagnetDB/python_magnetdb"
repository = "https://github.com/MagnetDB/python_magnetdb"
documentation = "https://docs.magnetdb.local"

[tool.poetry.dependencies]
python = ">=3.11"
django = ">=5.0.7,<6.0.0"
psycopg = {version = ">=3.2.1,<4.0.0", extras = ["binary"]}
jsonfield = ">=3.1.0,<4.0.0"
pyjwt = ">=2.8.0,<3.0.0"
uvicorn = ">=0.30.3,<1.0.0"
uvloop = ">=0.19.0,<1.0.0"
fastapi = ">=0.111.1,<1.0.0"
pydantic = ">=2.8.2,<3.0.0"
python-multipart = ">=0.0.9,<1.0.0"
minio = ">=7.2.7,<8.0.0"
requests = ">=2.32.3,<3.0.0"
cryptography = ">=43.0.0,<44.0.0"
celery = {version = ">=5.4.0,<6.0.0", extras = ["redis"]}
pandas = ">=2.2.1,<3.0.0"
pyarrow = ">=17.0.0,<18.0.0"
numpy = ">=2.2.2,<3.0.0"
scipy = ">=1.14.0,<2.0.0"
tabulate = ">=0.9.0,<1.0.0"
pyyaml = ">=6.0.2,<7.0.0"
Pint = ">=0.24,<1.0.0"
watchfiles = ">=1.0.4,<2.0.0"
pytz = ">=2025.2"
matplotlib = ">=3.8.0,<4.0.0"
mplcursors = ">=0.6.4,<1.0.0"
magnettools = {path = "/home/feelpp/magnettools-1.1.0-cp311-cp311-linux_x86_64.whl"}
python-magnetsetup = {path = "./python_magnetsetup"}
python-magnetgeo = {path = "./python_magnetgeo"}

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"
pytest-django = ">=4.5"
pytest-cov = ">=4.0"
black = ">=24.0"
isort = ">=5.13"
flake8 = ">=6.0"
mypy = ">=1.0"
django-stubs = ">=4.2"

[tool.poetry.scripts]
magnetdb = "python_magnetdb.cli:main"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "python_magnetdb.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "--cov=python_magnetdb --cov-report=html"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
